<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Territorial</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <!-- CSS -->
    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="bi bi-globe-americas"></i>
                </div>
                <div>
                    <h2>Consulta Territorial</h2>
                    <p>
                        Municípios • Bairros • Raio km
                    </p>
                </div>
            </div>
        </div>

        <!-- Pesquisa -->
        <div class="sidebar-card">
            <h5>
                <i class="bi bi-search"></i>
                Pesquisa
            </h5>

            <ul class="nav nav-pills nav-fill mb-3">
                <li class="nav-item">
                    <button
                        class="nav-link active"
                        data-bs-toggle="tab"
                        data-bs-target="#cepTab">
                        CEP
                    </button>
                </li>

                <li class="nav-item">
                    <button
                        class="nav-link"
                        data-bs-toggle="tab"
                        data-bs-target="#enderecoTab">
                        Endereço
                    </button>
                </li>

            </ul>
            <div class="tab-content">

                <!-- CEP -->
                <div
                    class="tab-pane fade show active"
                    id="cepTab">

                    <input
                        id="cepInput"
                        class="form-control mb-3"
                        placeholder="Digite um CEP">

                    <button
                        class="btn btn-primary w-100"
                        onclick="buscarCEP()">
                        Buscar CEP
                    </button>

                </div>

                <!-- ENDEREÇO -->
                <div
                    class="tab-pane fade"
                    id="enderecoTab">

                    <input
                        id="enderecoInput"
                        class="form-control mb-3"
                        placeholder="Digite um endereço">

                    <button
                        class="btn btn-success w-100"
                        onclick="buscarEndereco()">
                        Buscar Endereço
                    </button>

                </div>
            </div>
        </div>

        <!-- Configurações -->
        <div class="sidebar-card mt-3">

            <h5>
                <i class="bi bi-sliders"></i>
                Configurações
            </h5>

            <label class="form-label mt-3">
                Raio (km)
            </label>

            <input
                id="raioPesquisa"
                type="number"
                class="form-control"
                min="1"
                max="500"
                value="20">

        </div>

        <!-- Loading -->
        <div
            id="loading"
            class="sidebar-card mt-3 text-center d-none">
            <div class="spinner-border text-primary"></div>

            <p class="mt-3">
                Consultando...
            </p>
        </div>

        <!-- Resultado -->
        <div
            id="resultado"
            class="sidebar-card mt-3">

            <div class="placeholder-content text-center">
                <i
                    class="bi bi-map"
                    style="font-size:50px;color:#94a3b8;"></i>

                <p class="mt-3">
                    Faça uma pesquisa.
                </p>

            </div>

        </div>

        <!-- Municípios -->
        <div
            id="municipiosContainer"
            class="sidebar-card mt-3 d-none">
            <h5>
                <i class="bi bi-building"></i>
                Municípios encontrados
            </h5>
            <div id="listaMunicipios"></div>

        </div>
        <!-- Bairros -->
        <div
            id="bairrosContainer"
            class="sidebar-card mt-3 d-none">

            <h5>
                <i class="bi bi-pin-map"></i>
                Bairros encontrados
            </h5>
            <div id="listaBairros"></div>

        </div>

        <!-- Estatísticas -->
        <div
            id="estatisticasContainer"
            class="sidebar-card mt-3 d-none">

            <h5>
                <i class="bi bi-bar-chart"></i>
                Estatísticas
            </h5>

            <div id="estatisticas"></div>
        </div>

    </aside>

    <!-- Mapa-->

    <main class="map-container">
        <div class="map-header">
            <div>
                <h4>Raio de Km</h4>
                <small>
                    Municípios e bairros dentro do raio escolhido
                </small>
            </div>
        </div>
        <div id="mapa"></div>

    </main>
</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<!-- Turf -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- Scripts -->
<script src="js/httpClient.js"></script>
<script src="js/geosampa.js"></script>
<script src="js/app.js"></script>
<script src="js/cep.js"></script>
<script src="js/endereco.js"></script>

</body>
</html>
